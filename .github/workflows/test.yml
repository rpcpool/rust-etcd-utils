---
name: Test worfklow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This is needed if we are using github enterprise.
permissions:
  contents: write
  pull-requests: write
  id-token: write

on:
  push:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set cargo
        uses: dtolnay/rust-toolchain@1.79.0

      - name: Set nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Set build cargo cache
        uses: actions/cache@v4
        with:
          path: |
              ~/.cargo/bin/
              ~/.cargo/registry/index/
              ~/.cargo/registry/cache/
              ~/.cargo/git/db/
              fumarole/${{ matrix.os }}
          key: ${{ matrix.os }}_fumarole_${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}_fumarole

      - name: Cargo fmt
        if: startsWith(github.ref, 'refs/tags/') != true
        run: cargo +nightly fmt --all -- --check

      - name: Cargo clippy
        if: startsWith(github.ref, 'refs/tags/') != true
        run: cargo clippy --workspace --all-targets --tests --all-features

      - name: Cargo deny check advisories
        if: startsWith(github.ref, 'refs/tags/') != true
        uses: EmbarkStudios/cargo-deny-action@v1
        with:
          command: check advisories

      - name: Cargo check the entire project
        if: startsWith(github.ref, 'refs/tags/') != true
        run: cargo check --all-targets --tests --all-features

  test:
    needs: check
    runs-on: ubuntu-22.04
    services:
      etcd:
        image: quay.io/coreos/etcd:v3.5.21
        ports:
          - 2379:2379
        env:
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_ADVERTISE_CLIENT_URLS: http://localhost:2379
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set cargo
        uses: dtolnay/rust-toolchain@1.79.0

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Run tests
        run: cargo test --all-features -- --nocapture